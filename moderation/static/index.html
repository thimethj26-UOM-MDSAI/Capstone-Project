<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocialLK (demo)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Iskoola Pota","Noto Sans Sinhala",sans-serif;background:#f0f2f5;color:#1c1e21}
header{background:#1d4ed8;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}select,button,textarea,input{font:inherit}
select{padding:4px 8px;border-radius:6px;border:0}
.bell{position:relative;background:#ffffff22;color:#fff;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
.bell b{background:#dc2626;border-radius:10px;padding:0 6px;font-size:12px;margin-left:4px}
main{max-width:640px;margin:16px auto;padding:0 12px}
.card{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 2px #0002}
.meta{font-size:13px;color:#65676b;margin-bottom:4px}.meta b{color:#1c1e21}
.text{white-space:pre-wrap;word-break:break-word}
textarea{width:100%;border:1px solid #ccd0d5;border-radius:8px;padding:8px;resize:vertical}
.btn{background:#1d4ed8;color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer}
.comments{margin-top:10px;border-top:1px solid #e4e6eb;padding-top:8px}
.comment{background:#f0f2f5;border-radius:8px;padding:6px 10px;margin-bottom:6px}
.row{display:flex;gap:6px;margin-top:6px}.row input{flex:1;border:1px solid #ccd0d5;border-radius:16px;padding:6px 12px}
.removed{border-left:4px solid #dc2626;background:#fef2f2}.flagged{border-left:4px solid #d97706}
.badge{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;margin-left:6px;color:#fff}
.b-removed{background:#dc2626}.b-flagged{background:#d97706}.b-restored{background:#16a34a}
#toast{position:fixed;right:14px;bottom:14px;max-width:340px;background:#111827;color:#fff;padding:12px 14px;border-radius:10px;display:none;z-index:9}
#panel{position:fixed;right:14px;top:52px;width:340px;max-height:60vh;overflow:auto;background:#fff;border-radius:10px;box-shadow:0 4px 16px #0004;display:none;z-index:8;padding:8px}
#panel div{padding:8px;border-bottom:1px solid #eee;font-size:14px}.new{background:#fffbeb}
.empty{color:#65676b;text-align:center;padding:24px}
</style></head><body>
<header><h1>SocialLK <small style="opacity:.7">demo</small></h1>
<label>Logged in as <select id="user"></select></label>
<button class="bell" id="bell">Alerts<b id="cnt" style="display:none">0</b></button>
<a href="/admin" style="color:#fff;font-size:13px">Moderator view &rarr;</a></header>
<div id="panel"></div><div id="toast"></div>
<main>
 <div class="card"><textarea id="newpost" rows="3" placeholder="What's on your mind? (Sinhala)"></textarea>
 <div style="text-align:right;margin-top:6px"><button class="btn" id="postbtn">Post</button></div></div>
 <div id="feed"></div>
</main>
<script>
const $=id=>document.getElementById(id);let user=null;
const api=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.statusText);return r.json()};
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',6000)}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function badge(i){if(i.author!==user)return null;
 if(i.status==='removed')return el('span','badge b-removed','removed');
 if(i.status==='flagged')return el('span','badge b-flagged','under review');
 if(i.status==='restored')return el('span','badge b-restored','restored by moderator');return null}
function node(i,isPost){const c=el('div',(isPost?'card ':'comment ')+(i.author===user&&i.status==='removed'?'removed':i.author===user&&i.status==='flagged'?'flagged':''));
 const m=el('div','meta');m.appendChild(el('b','',i.author));const b=badge(i);if(b)m.appendChild(b);c.appendChild(m);
 if(i.author===user&&i.status==='removed'){c.appendChild(el('div','text','Removed: this '+i.kind+' was taken down by the moderation scanner. Only you can see this notice.'));
  const t=el('div','meta','Original text (visible only to you): '+i.text);t.style.marginTop='6px';c.appendChild(t)}
 else c.appendChild(el('div','text',i.text));return c}
async function loadFeed(){const f=await api('/api/feed?viewer='+encodeURIComponent(user));const box=$('feed');box.textContent='';
 if(!f.length){box.appendChild(el('div','empty card','No posts yet. Write one above, or load demo data from the Moderator view.'));return}
 f.forEach(p=>{const c=node(p,true);const cm=el('div','comments');p.comments.forEach(x=>cm.appendChild(node(x,false)));
  const row=el('div','row');const inp=el('input');inp.placeholder='Write a comment...';const bt=el('button','btn','Send');
  const send=async()=>{if(!inp.value.trim())return;bt.disabled=true;try{const r=await post('/api/comments',{author:user,post_id:p.id,text:inp.value});inp.value='';verdict(r)}catch(e){toast(e.message)}bt.disabled=false;await loadFeed();pollAlerts()};
  bt.onclick=send;inp.onkeydown=e=>{if(e.key==='Enter')send()};row.append(inp,bt);cm.appendChild(row);c.appendChild(cm);box.appendChild(c)})}
function verdict(r){if(r.status==='removed')toast('Your '+r.kind+' was NOT published: the scanner found it very likely to contain offensive language.');
 else if(r.status==='flagged')toast('Published, but flagged for moderator review.')}
const seen=new Set();let primed=false;
async function pollAlerts(){const a=await api('/api/alerts?user='+encodeURIComponent(user));const unread=a.filter(x=>!x.read);
 const c=$('cnt');c.textContent=unread.length;c.style.display=unread.length?'inline':'none';
 unread.forEach(x=>{if(!seen.has(x.id)){seen.add(x.id);if(primed)toast(x.message)}});primed=true;
 const p=$('panel');p.textContent='';if(!a.length)p.appendChild(el('div','','No alerts.'));a.forEach(x=>{const d=el('div',x.read?'':'new',x.message);d.appendChild(el('div','meta',new Date(x.created_at*1000).toLocaleTimeString()));p.appendChild(d)})}
$('bell').onclick=async()=>{const p=$('panel');const open=p.style.display==='block';p.style.display=open?'none':'block';if(!open){await pollAlerts();await api('/api/alerts?user='+encodeURIComponent(user)+'&mark_read=true');setTimeout(pollAlerts,300)}};
$('postbtn').onclick=async()=>{const t=$('newpost').value;if(!t.trim())return;try{const r=await post('/api/posts',{author:user,text:t});$('newpost').value='';verdict(r)}catch(e){toast(e.message)}loadFeed();pollAlerts()};
$('user').onchange=()=>{user=$('user').value;seen.clear();primed=false;loadFeed();pollAlerts()};
(async()=>{const us=await api('/api/users');us.forEach(u=>{const o=el('option','',u);o.value=u;$('user').appendChild(o)});user=us[0];loadFeed();pollAlerts();setInterval(pollAlerts,4000);setInterval(loadFeed,15000)})();
</script></body></html>
